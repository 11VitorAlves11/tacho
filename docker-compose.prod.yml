# Compose de produção — imagens pré-compiladas do GHCR (publicadas por
# .github/workflows/build-and-push.yml), não build local. Para
# desenvolvimento local usa-se docker-compose.yml (vite dev + hot reload,
# build local), não este ficheiro.
#
# Imagens fixadas numa versão concreta (vX.Y.Z), nunca `:latest` — para
# um deploy ser sempre deliberado (`git tag vX.Y.Z && git push --tags`,
# esperar o workflow publicar, só depois mudar a tag aqui), nunca por
# acidente num restart. Mesmo padrão do Securo no homelab.
#
# Imagens privadas (o Dockerfile faz COPY . ., a imagem carrega o
# código-fonte tal como o repo) — o host que faz `pull` precisa de sessão
# no GHCR (`docker login ghcr.io`, PAT com read:packages). Ver
# homelab/inventory.md, CT 202, para o token e o fluxo de deploy completo.
#
# Sem chave `name:` de topo de propósito — incompatível com o
# docker-compose 1.29.2 do homelab (ver homelab/CLAUDE.md, "Docker",
# exceção da CT 209/securo).
#
# POSTGRES_DATA_DIR e IMAGES_DIR são opcionais: por omissão usam volumes
# Docker nomeados (bons para testar isto localmente); num deploy real
# apontam para bind mounts persistentes (ex.: /mnt/vmdata/.../postgresql).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR:-tacho_pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/11vitoralves11/tacho_app-web:v1.5.1
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # `env_file: .env` acima injeta TODO o .env no processo — incluindo
      # IMAGES_DIR, que aqui só devia servir para resolver ${IMAGES_DIR} no
      # `volumes:` abaixo (caminho do HOST). Sem esta linha, esse mesmo
      # valor (ex. /mnt/vmdata/.../mediafiles) também chega ao
      # `Settings.images_dir` da app (config.py, lido por nome via
      # pydantic-settings) e substitui o omisso "images" — a app passa a
      # gravar fotos num caminho absoluto dentro do container que não
      # corresponde a bind mount nenhum, perdido sempre que o container é
      # recriado. Esta linha repõe o valor que a app espera.
      IMAGES_DIR: images
    ports:
      - "${WEB_PORT:-80}:8000"
    volumes:
      - ${IMAGES_DIR:-tacho_images}:/app/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: ghcr.io/11vitoralves11/tacho_app-celery-worker:v1.5.1
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Ver o comentário equivalente no serviço `web` acima — mesma colisão,
      # mesma correção.
      IMAGES_DIR: images
    volumes:
      - ${IMAGES_DIR:-tacho_images}:/app/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info

  # Uma instância por CT Docker, monitor-only (nunca atualiza sozinha) —
  # convenção do homelab, ver homelab/CLAUDE.md.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    hostname: tacho
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Lisbon
      WATCHTOWER_SCHEDULE: "0 0 13 * * 1"
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_LABEL_ENABLE: "false"

volumes:
  tacho_pgdata:
  tacho_images:
