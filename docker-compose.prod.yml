name: tacho

# Compose de produção — usa a imagem única (Dockerfile na raiz, backend a
# servir também o frontend compilado). Para desenvolvimento local usa-se
# docker-compose.yml (vite dev + hot reload), não este ficheiro.
#
# POSTGRES_DATA_DIR e IMAGES_DIR são opcionais: por omissão usam volumes
# Docker nomeados (bons para testar isto localmente); num deploy real
# apontam para bind mounts persistentes (ex.: /mnt/vmdata/.../postgresql).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR:-tacho_pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "${WEB_PORT:-80}:8000"
    volumes:
      - ${IMAGES_DIR:-tacho_images}:/app/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ${IMAGES_DIR:-tacho_images}:/app/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info

  # Uma instância por CT Docker, monitor-only (nunca atualiza sozinha) —
  # convenção do homelab, ver homelab/CLAUDE.md.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    hostname: tacho
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Lisbon
      WATCHTOWER_SCHEDULE: "0 0 13 * * 1"
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_LABEL_ENABLE: "false"

volumes:
  tacho_pgdata:
  tacho_images:
