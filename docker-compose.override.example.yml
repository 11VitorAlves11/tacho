# Copy this file outside the public repository or into a private infrastructure
# repository before adding real host paths.
services:
  db:
    volumes:
      - /srv/tacho/postgres:/var/lib/postgresql/data
  web:
    volumes:
      - /srv/tacho/images:/app/images
      - tacho_secrets:/run/tacho-secrets:ro
  worker:
    volumes:
      - /srv/tacho/images:/app/images
      - tacho_secrets:/run/tacho-secrets:ro
  migrate:
    volumes:
      - /srv/tacho/images:/app/images
      - tacho_secrets:/run/tacho-secrets:ro

