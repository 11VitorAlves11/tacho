# Copy this file to `docker-compose.override.yml` only when bind mounts are
# required. Set `TACHO_DATA_DIR` to a directory you control.
services:
  db:
    volumes:
      - ${TACHO_DATA_DIR:-./.data}/postgres:/var/lib/postgresql/data
  web:
    volumes:
      - ${TACHO_DATA_DIR:-./.data}/images:/app/images
      - tacho_secrets:/run/tacho-secrets:ro
  worker:
    volumes:
      - ${TACHO_DATA_DIR:-./.data}/images:/app/images
      - tacho_secrets:/run/tacho-secrets:ro
  migrate:
    volumes:
      - ${TACHO_DATA_DIR:-./.data}/images:/app/images
      - tacho_secrets:/run/tacho-secrets:ro
