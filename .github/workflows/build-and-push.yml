name: Build and push images

# Publica as duas imagens de produção no GHCR (privado — o Dockerfile faz
# COPY . ., a imagem carrega o código-fonte tal como o repo) a cada push
# para master. O deploy no homelab passa a ser só `docker compose pull` +
# `up -d` no CT 202 (ver homelab/inventory.md, CT 202).

on:
  push:
    branches: [master]

env:
  # GHCR exige nomes em minúsculas — github.repository ("11VitorAlves11/tacho_app")
  # não serve directamente, as expressões do Actions não têm lower() nativo.
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/11vitoralves11/tacho_app-web
  CELERY_IMAGE: ghcr.io/11vitoralves11/tacho_app-celery-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web (imagem única — backend serve o frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery-worker (backend só)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.CELERY_IMAGE }}:latest
            ${{ env.CELERY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
