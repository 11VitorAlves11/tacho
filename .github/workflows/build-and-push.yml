name: Build and push images

# Publica as duas imagens de produção no GHCR (privado — o Dockerfile faz
# COPY . ., a imagem carrega o código-fonte tal como o repo).
#
# - Push para master: tags `:latest` + `:<sha>`.
# - Push de uma tag `vX.Y.Z`: tag `:vX.Y.Z` (build a partir do código nessa
#   tag, não de master — permite publicar versões retroativas). Nunca usar
#   `:latest` em produção; docker-compose.prod.yml fixa sempre uma versão
#   concreta (mesmo padrão do Securo no homelab — atualizar de propósito,
#   nunca por acidente num restart).
# - Manual (workflow_dispatch, inputs ref+version): compila um commit/tag
#   antigo à força, útil para publicar retroactivamente uma versão cujo
#   commit é anterior à existência deste workflow (o push normal da tag
#   não dispara nada nesse caso — o GitHub resolve o ficheiro do workflow
#   a partir do próprio ref que fez o push, e esse ref antigo nunca chegou
#   a ter este ficheiro).

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref a compilar (tag, branch ou sha)"
        required: true
      version:
        description: "Tag da imagem a publicar (ex. v1.0.0)"
        required: true

env:
  # GHCR exige nomes em minúsculas — github.repository ("11VitorAlves11/tacho_app")
  # não serve directamente, as expressões do Actions não têm lower() nativo.
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/11vitoralves11/tacho_app-web
  CELERY_IMAGE: ghcr.io/11vitoralves11/tacho_app-celery-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags a partir do tipo de evento
        id: tags
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "web=${{ env.WEB_IMAGE }}:$VERSION" >> "$GITHUB_OUTPUT"
            echo "celery=${{ env.CELERY_IMAGE }}:$VERSION" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            echo "web=${{ env.WEB_IMAGE }}:$VERSION" >> "$GITHUB_OUTPUT"
            echo "celery=${{ env.CELERY_IMAGE }}:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "web=${{ env.WEB_IMAGE }}:latest,${{ env.WEB_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "celery=${{ env.CELERY_IMAGE }}:latest,${{ env.CELERY_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push web (imagem única — backend serve o frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery-worker (backend só)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.celery }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
