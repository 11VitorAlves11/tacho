name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: tacho
          POSTGRES_PASSWORD: tacho-test
          POSTGRES_DB: tacho_test
        options: >-
          --health-cmd "pg_isready -U tacho -d tacho_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:8.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg2://tacho:tacho-test@localhost:5432/tacho_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.8.15
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Lint and format
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Type check
        working-directory: backend
        run: uv run mypy app
      - name: Validate and apply migrations
        working-directory: backend
        run: |
          test "$(uv run alembic heads | grep -c '(head)')" -eq 1
          uv run alembic upgrade head
          uv run alembic check
      - name: Test
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Audit Python dependencies
        working-directory: backend
        run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Type check and build
        working-directory: frontend
        run: npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ghcr.io/11vitoralves11/tacho:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test Compose
        run: |
          cp .env.example .env
          docker compose up -d --wait
          curl --fail --retry 10 --retry-delay 2 http://localhost:8000/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
